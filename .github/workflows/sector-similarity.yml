name: Sektör benzerliği (vektör)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install sentence-transformers numpy
      - run: python scripts/sector_similarity.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Sonucu kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data/sector_similarity.json
          git diff --cached --quiet || git commit -m "Sektör benzerlik analizi $(date -u +%F)"
          git pull --rebase origin main
          git push
