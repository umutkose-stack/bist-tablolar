name: Verileri güncelle

on:
  schedule:
    # Her gün 19:17 (TR saati 22:17) - bilanço dönemlerinde yeni açıklamaları yakalar
    - cron: "17 19 * * *"
  workflow_dispatch:   # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date -u +%F)"
          git push
