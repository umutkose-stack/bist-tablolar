name: Verileri güncelle

on:
  schedule:
    # Her gün 19:17 (TR saati 22:17) - bilanço dönemlerinde yeni açıklamaları yakalar
    - cron: "17 19 * * *"
    # Yedek: GitHub zamanlanmış görevleri bazen geciktirir/atlar
    - cron: "43 3 * * *"
  workflow_dispatch:   # Actions sekmesinden elle çalıştırma
    inputs:
      symbols:
        description: "Sadece bu hisseler (boşluklu, ör. THYAO ASELS). Boş = hepsi"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testler (hesap kuralları bozulduysa veriyi güncelleme)
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/data-context.test.cjs
      - run: python scripts/fetch_data.py ${{ github.event.inputs.symbols }}
        env:
          PYTHONUNBUFFERED: "1"
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date -u +%F)"
          git pull --rebase origin main
          git push
