name: Verileri güncelle

on:
  schedule:
    # Her gün 19:17 (TR saati 22:17) - bilanço dönemlerinde yeni açıklamaları yakalar
    - cron: "17 19 * * *"
    # Yedek: GitHub zamanlanmış görevleri bazen geciktirir/atlar
    - cron: "43 3 * * *"
  workflow_dispatch:   # Actions sekmesinden elle çalıştırma
    inputs:
      symbols:
        description: "Sadece bu hisseler (boşluklu, ör. THYAO ASELS). Boş = hepsi"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Yedek zamanlama - veri tazeyse atla
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          d = json.load(open("data/summary.json"))
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(d["updated_at"])).total_seconds() / 3600
          skip = age < 26   # gece görevi 24 saatte bir çalışır; yedek yalnızca bir gece kaçarsa devreye girsin
          print(f"Son başarılı güncelleme {age:.1f} saat önce ({d['updated_at']}). " + ("Veri taze, bu yedek çalışma atlanıyor." if skip else "Veri eski, yedek çalışma güncelliyor."))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != 'true'
      - name: Testler (hesap kuralları bozulduysa veriyi güncelleme)
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/data-context.test.cjs
      - run: python scripts/fetch_data.py ${{ github.event.inputs.symbols }}
        if: steps.fresh.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
      - name: Veri kontrolü (bozuk veri yayımlanmasın)
        if: steps.fresh.outputs.skip != 'true'
        id: check
        run: python scripts/check_data.py
      - name: Değişiklikleri kaydet
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "veri-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if [ "${{ steps.check.outputs.blocked }}" = "true" ]; then MSG="Veri kontrolü: yeni veri ENGELLENDİ $(date -u +%F)"; else MSG="Veri güncellemesi $(date -u +%F)"; fi
          git diff --cached --quiet || git commit -m "$MSG"
          git pull --rebase origin main
          git push
      - name: Engellendiyse çalışmayı başarısız say (bildirim için)
        if: steps.fresh.outputs.skip != 'true' && steps.check.outputs.blocked == 'true'
        run: |
          echo "::error::Veri kontrolü yeni veriyi engelledi; site önceki veriyle kaldı. Ayrıntı: data/data_check.json"
          exit 1
